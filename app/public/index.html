<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1724">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Pool</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div>
      <h1 data-i18n="appTitle">Pool</h1>
      <p class="sub"><span id="dot" class="dot"></span><span id="conn">Connecting…</span></p>
    </div>
    <div class="top-actions">
    <select id="lang" class="lang-select"></select>
    <a href="settings.html" class="icon-btn" data-i18n-aria="settings" data-i18n-title="settings">
      <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <button id="refresh" class="icon-btn" data-i18n-aria="refresh" data-i18n-title="refresh">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    </div>
  </header>

  <main>
    <!-- Hero: water temperature -->
    <section class="card hero">
      <div class="gauge">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle class="track" cx="100" cy="100" r="84"/>
          <circle id="arc" class="arc" cx="100" cy="100" r="84" />
          <circle id="mark" class="mark" cx="184" cy="100" r="6"/>
        </svg>
        <div class="gauge-text">
          <span class="label" data-i18n="water">Water</span>
          <span class="big"><span id="water">--.-</span><small>°C</small></span>
          <span class="delta" id="delta">&nbsp;</span>
        </div>
      </div>

      <div class="setpoint">
        <span class="label" id="spLabel">Setpoint</span>
        <div class="stepper">
          <button data-step="-0.5" data-i18n-aria="lower">−</button>
          <output id="sp">--.-</output>
          <button data-step="0.5" data-i18n-aria="raise">+</button>
        </div>
        <span class="hint" id="spHint">&nbsp;</span>
      </div>
    </section>

    <!-- Live status -->
    <section class="grid3">
      <div class="card stat">
        <span class="label" data-i18n="solar">Solar</span>
        <span class="val"><span id="solar">--.-</span><small>°C</small></span>
        <span class="pill" id="solarState">—</span>
      </div>
      <div class="card stat">
        <span class="label" data-i18n="filtration">Filtration</span>
        <span class="val txt" id="filter">—</span>
        <span class="pill" id="filterState">—</span>
      </div>
      <div class="card stat">
        <span class="label" data-i18n="heating">Heating</span>
        <span class="val txt" id="heating">—</span>
        <span class="pill" id="heaterState">—</span>
      </div>
    </section>

    <!-- Controls -->
    <h2 data-i18n="commands">Controls</h2>
    <section class="grid3 controls">
      <button class="card tile" data-cmd="pump_toggle" id="tPump">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v8l5 5"/></svg>
        <span data-i18n="pump">Pump</span><em>—</em>
      </button>
      <button class="card tile" id="tAux">
        <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
        <span data-i18n="light">Light</span><em>—</em>
      </button>
      <button class="card tile" data-cmd="eco_toggle" id="tEco">
        <svg viewBox="0 0 24 24"><path d="M5 19c8 0 14-6 14-14C11 5 5 11 5 19zm0 0 7-7"/></svg>
        <span data-i18n="eco">ECO</span><em>—</em>
      </button>
    </section>

    <h2 data-i18n="modes">Modes</h2>
    <section class="card list">
      <button class="row" data-cmd="heater_mode_cycle"><span data-i18n="heaterMode">Heater mode</span><b id="mHeat">—</b></button>
      <button class="row" data-cmd="solar_mode_cycle"><span data-i18n="solarMode">Solar mode</span><b id="mSolar">—</b></button>
      <button class="row" data-cmd="aux_mode_cycle"><span data-i18n="auxMode">Light (AUX) mode</span><b id="mAux">—</b></button>
      <button class="row danger" id="backwash"><span data-i18n="backwash">Backwash</span><b id="mWash">Hold to start</b></button>
    </section>
    <a href="settings.html" class="card list linkrow"><span class="row"><span data-i18n="advancedLink">Timers &amp; advanced settings</span><b>›</b></span></a>

    <p class="foot" id="updated">&nbsp;</p>
  </main>

  <!-- Confirm: light needs the pump -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-bg" data-close></div>
    <div class="sheet-panel card">
      <div class="sheet-grip"></div>
      <h3 data-i18n="auxPumpTitle">Pump required</h3>
      <p class="sheet-text" data-i18n="auxPumpText"></p>
      <div class="sheet-actions">
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close data-i18n="cancel">Cancel</button>
        <button type="button" class="btn primary" id="auxPumpGo" data-i18n="auxPumpGo">Start pump + light</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js" type="module"></script>
</body>
</html>
